name: Build release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install KiCad 10 and build tools
        run: |
          sudo add-apt-repository --yes ppa:kicad/kicad-10.0-releases
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            kicad imagemagick libarchive-tools librsvg2-bin python3-matplotlib \
            python3-networkx python3-numpy python3-pip
          python3 -m pip install --break-system-packages trimesh

      - name: Install project dependencies
        run: npm ci --allow-git=all

      - name: Install pinned Freerouting
        run: npm run setup:router

      - name: Generate manufacturing files
        run: |
          npm run generate
          npm run validate
          npm run render
          npm run print:1to1
          npm run gerbers
          python3 scripts/validate-case.py

      - name: Package release assets
        run: npm run release:package -- "${GITHUB_REF_NAME}"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cat > "${RUNNER_TEMP}/release-notes.md" <<'EOF'
          ## Compact Choc V2 Numpad — Rev A

          This release contains the ready-to-manufacture Gerbers, routed KiCad
          project, printable enclosure STLs, 1:1 fit-check PDF, previews,
          Ergogen web-editor bundle, QMK source, BOM, and SHA-256 checksums.

          **Rev A has not yet been physically manufactured.** Print the 1:1 PDF
          and test the exact switch, socket, encoder, controller, diode, and
          keycap before placing a fabrication order.
          EOF
          gh release create "${GITHUB_REF_NAME}" \
            output/release/"${GITHUB_REF_NAME}"/* \
            --verify-tag \
            --title "Compact Choc Numpad ${GITHUB_REF_NAME}" \
            --notes-file "${RUNNER_TEMP}/release-notes.md"
